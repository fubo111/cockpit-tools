name: Codex Fast Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-tests:
    if: github.repository == 'fubo111/cockpit-tools'
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6164ed0794b645d6923770c4f94c23c735872fd
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev libnm-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codex-fast-rust-tests
      - name: Run startup readiness and enhancement Rust tests
        run: cargo test --locked -p cockpit-tools --lib modules::codex_app_enhancements

  windows-package:
    if: github.repository == 'fubo111/cockpit-tools'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6164ed0794b645d6923770c4f94c23c735872fd
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: codex-fast-windows-validation
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Run existing startup JavaScript regressions
        run: node --experimental-vm-modules --test src-tauri/src/modules/codex_app_enhancements/service_rspack.test.cjs src-tauri/src/modules/codex_app_enhancements/browser_preload_guard.test.cjs src-tauri/src/modules/codex_app_enhancements/startup_preload.test.cjs
      - name: Build Windows app with embedded frontend
        run: npx tauri build --ci --debug --no-bundle
      - name: Package test app with runtime resources
        run: node scripts/release/build_windows_portable.cjs --version 1.4.0-fast-a6164ed-test --release-dir target/debug --output-dir test-artifacts
      - name: Record test package checksum
        shell: pwsh
        run: |
          $checksums = Get-ChildItem -LiteralPath test-artifacts -Filter *.zip | ForEach-Object {
            $result = Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName
            "$($result.Hash.ToLower())  $($_.Name)"
          }
          $checksums | Set-Content -LiteralPath test-artifacts/SHA256SUMS.txt -Encoding utf8
      - name: Upload test package
        uses: actions/upload-artifact@v6
        with:
          name: cockpit-fast-windows-test-a6164ed
          retention-days: 7
          if-no-files-found: error
          path: test-artifacts/
