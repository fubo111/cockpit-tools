name: Codex Fast Windows validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'fubo111/cockpit-tools'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: a6164ed0794b645d6923770c4f94c23c735872fd
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install project dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Run existing startup JavaScript regressions
        run: node --experimental-vm-modules --test src-tauri/src/modules/codex_app_enhancements/service_rspack.test.cjs src-tauri/src/modules/codex_app_enhancements/browser_preload_guard.test.cjs src-tauri/src/modules/codex_app_enhancements/startup_preload.test.cjs
      - name: Run startup readiness and enhancement Rust tests
        run: cargo test --locked -p cockpit-tools --lib modules::codex_app_enhancements
      - name: Compile Windows test executable
        run: cargo build --locked -p cockpit-tools --bin cockpit-tools
      - name: Record executable checksum
        shell: pwsh
        run: |
          $result = Get-FileHash -Algorithm SHA256 -LiteralPath target/debug/cockpit-tools.exe
          "$($result.Hash.ToLower())  cockpit-tools.exe" | Set-Content -LiteralPath target/debug/SHA256SUMS.txt -Encoding utf8
      - name: Upload test executable
        uses: actions/upload-artifact@v6
        with:
          name: cockpit-fast-windows-test-a6164ed
          retention-days: 7
          if-no-files-found: error
          path: |
            target/debug/cockpit-tools.exe
            target/debug/SHA256SUMS.txt
